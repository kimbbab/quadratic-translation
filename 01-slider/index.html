<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>이차함수 그래프 평행이동 — 슬라이더로 이동</title>
  <link rel="stylesheet" href="../common-assets/amanta/da_mi_math2/public/common/css/amt-content.css">
  <link rel="stylesheet" href="css/amt-index.bundle.css">
  <link rel="stylesheet" href="css/amt-index.css">
</head>
<body>
  <p id="loading-message" role="status">활동을 불러오는 중입니다.</p>
  <div id="activity-frame">
    <div id="amt-viewer-wraper" class="html-type quadratic-page" data-mode="slider">
      <main id="content" class="corner_unit color-type-2" aria-label="이차함수 그래프 평행이동 문제 2">
        <div id="quiz-main-01">
          <!-- 본문 메인 스크롤 영역 -->
          <div class="main-scroll scroll-cont js-scroll-cont">
            <div class="scroll-inner" style="height: auto">
              <!-- 본문 지시문 :: 문제 + 숫자 -->
              <div class="title-quiz-num">
                <div class="bullet"><span class="text">문제</span><span class="num">2</span></div>
                <div class="text-cont">
                  <div class="text-1">다음은 이차함수 <span class="math" aria-label="와이 는 이 엑스 제곱"><i>y</i> = 2<i>x</i><sup>2</sup></span>과 <span class="math" aria-label="와이 는 마이너스 이분의 일 엑스 제곱"><i>y</i> = −<span class="fraction"><span>1</span><span>2</span></span><i>x</i><sup>2</sup></span>의 그래프를 좌표평면 위에 나타낸 것이다. 이 그래프를<br class="desktop-break"> 이용하여 아래 이차함수의 그래프를 그리고, 축의 방정식과 꼭짓점의 좌표를 각각 구하시오.</div>
                </div>
              </div>
              <!-- 본문 콘텐츠 영역 - 문제 -->
              <div class="content-area">
                <div class="content-box" style="height: auto">
                  <div id="problems" class="problems"></div>
                </div>
              </div>
            </div>
          </div>
          <!-- 원본 문제 유형과 같은 하단 채점 버튼 -->
          <div class="bottom-g-icon btns-bottom">
            <button class="g-icon answer btn-answer" type="button" aria-controls="answer-popup-01" aria-expanded="false" hidden><span class="text">풀이 보기</span></button>
            <p id="overall-result" role="status" aria-live="polite" aria-atomic="true"></p>
            <button class="g-icon restart btn-restart" type="button"><span class="text">다시 하기</span></button>
            <button class="g-icon mark btn-mark" type="button"><span class="text">채점하기</span></button>
          </div>
          <!-- 정답 보기 유형: 풀이 보기 -->
          <section id="answer-popup-01" class="g-answer-cont explain" role="region" aria-label="정답과 풀이" hidden>
            <div class="inner"><div class="body">
              <button class="btn-answer-close" type="button" aria-label="풀이 닫기">×</button>
              <div class="answer-block">
                <div class="bullet">정답</div>
                <div class="text-cont solution-grid">
                  <div class="bracket-num-text"><div class="num">(<span class="count">1</span>)</div><div class="text">축의 방정식: <span class="math"><i>x</i> = 0</span><br>꼭짓점의 좌표: <span class="math">(0, −3)</span></div></div>
                  <div class="bracket-num-text"><div class="num">(<span class="count">2</span>)</div><div class="text">축의 방정식: <span class="math"><i>x</i> = 0</span><br>꼭짓점의 좌표: <span class="math">(0, 1)</span></div></div>
                </div>
              </div>
              <div class="explain-block">
                <div class="bullet">풀이</div>
                <div class="text-cont solution-grid">
                  <div class="bracket-num-text"><div class="num">(<span class="count">1</span>)</div><div class="text"><span class="math"><i>y</i> = 2<i>x</i><sup>2</sup></span>의 그래프를 아래로 3만큼<br>평행이동한다.</div></div>
                  <div class="bracket-num-text"><div class="num">(<span class="count">2</span>)</div><div class="text"><span class="math"><i>y</i> = −<span class="fraction"><span>1</span><span>2</span></span><i>x</i><sup>2</sup></span>의 그래프를 위로 1만큼<br>평행이동한다.</div></div>
                </div>
              </div>
            </div></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <noscript><p>이 활동을 사용하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
  <script src="js/amt-index.bundle.js"></script>
</body>
</html>
